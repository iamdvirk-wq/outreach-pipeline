<tr id="reply-{{ r.id }}">
  <td>{{ r.received_at|dt }}</td>
  <td><a href="/leads/{{ r.business.id }}">{{ r.business.name }}</a></td>
  <td class="small">{{ r.from_address }}</td>
  <td><span class="badge c-{{ r.classification }}">{{ r.classification.replace('_', ' ') }}</span></td>
  <td class="small">{{ (r.snippet or '')[:200] }}</td>
  <td>
    <form method="post" action="/replies/{{ r.id }}/handled" hx-post="/replies/{{ r.id }}/handled" hx-target="#reply-{{ r.id }}" hx-swap="outerHTML">
      <button>{{ '✓ Handled' if r.handled else 'Mark handled' }}</button>
    </form>
  </td>
</tr>
